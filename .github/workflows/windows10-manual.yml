name: Manual Windows 10 source build
run-name: Nod n8n for Windows 10, manual unsigned build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-windows10-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ebrahimhammad1/nod-windows10-experiment' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out reviewed build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact upstream application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: n8n-io/nod
          ref: 2118c357299fe550bd693b8fdfd7c1b4fa580c7e
          path: build-source
          persist-credentials: false
      - name: Verify reviewed build inputs
        run: |
          mv 1-1-windows10-ci.py windows10-ci.py
          mv 2-2-windows10-source.patch windows10-source.patch
          mv 3-windows10-runtime.json windows10-runtime.json
          echo '8648ec687231e3028424ff456f75ca5db8e20728487eeaad43767d6405bda915  windows10-ci.py' | sha256sum -c -
          echo '0dc578c78d2a47a3dbee7e4c4515cfca5c11e417a6620398cb43c8b7aab5d7fa  windows10-source.patch' | sha256sum -c -
          echo '7fcdec115347791b32c6fdec1918ddb1f2774c979f8f624b3c5c5eaa0fba42a3  windows10-runtime.json' | sha256sum -c -
          python3 windows10-ci.py prepare
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Set up pinned Go without retained cache
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: 1.27.4
          cache: false
      - name: Install build tools, no paid services
        run: |
          npm install --global pnpm@10.34.5
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis p7zip-full
          df -h .
          test "$(df --output=avail -k . | tail -1)" -gt 9000000
      - name: Build and verify unsigned experimental installer
        run: python3 windows10-ci.py build
      - name: Publish complete source and unsigned installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 windows10-ci.py publish
