name: Manual packaged skills validation diagnostic
run-name: Diagnose shipped Windows skills validation, no rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-validation:
    if: github.repository == 'ebrahimhammad1/nod-windows10-experiment' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Verify unchanged released installer and test its own engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/ebrahimhammad1/nod-windows10-experiment/releases/download/win10-0.9.4-build-45286515402/nod-n8n-Windows10-0.9.4-unsigned.exe' -OutFile installer.exe
          if ((Get-FileHash installer.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f3c9d11ff50ade5e07394ecf2bf0b7411a89991f6066e94e947b82b67030233c') { throw 'Installer hash mismatch' }
          7z x installer.exe -oapplication -y | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $engine = Join-Path $PWD 'application/resources/engine'
          $script = @'
          // Run against an extracted release using its own Electron executable and dependencies.
          // Synthetic data only. Does not open Nod, load a profile, contact a model or alter settings.
          import assert from 'node:assert/strict';
          import { register } from 'tsx/esm/api';
          register();
          const { toolDefinitions } = await import('./src/runtime/tools.ts');
          const { validateToolArguments } = await import('@earendil-works/pi-ai');
          const { draft2020Schema } = await import('./src/shared/json-schema.ts');
          const results = [];
          for (const parameters of [toolDefinitions.skills.parameters, JSON.parse(JSON.stringify(toolDefinitions.skills.parameters)), draft2020Schema(toolDefinitions.skills.parameters)]) {
            const tool = { name: 'skills', parameters };
            for (const args of [{ action: 'list' }, { action: 'read', name: 'nod' }, { action: 'save', name: 'fixture', description: 'Synthetic', body: 'Synthetic' }, { action: 'patch', name: 'fixture', old: 'a', new: 'b' }]) {
              const result = validateToolArguments(tool, { name: 'skills', arguments: args });
              assert.deepEqual(result, args);
              results.push(args.action);
            }
            for (const action of ['LIST', ' list', 'bogus', null, {}]) {
              assert.throws(() => validateToolArguments(tool, { name: 'skills', arguments: { action } }), /Validation failed for tool/);
            }
          }
          console.log(JSON.stringify({ platform: process.platform, versions: process.versions, valid: results.length, invalid: 15, result: 'passed' }));
          '@
          [IO.File]::WriteAllText((Join-Path $engine 'skills-validation-diagnostic.mjs'), $script)
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:ESBUILD_WORKER_THREADS = '0'
          $env:NODE_ENV = 'production'
          $env:NOD_ANALYTICS_ENABLED = 'false'
          Remove-Item Env:ESBUILD_BINARY_PATH -ErrorAction SilentlyContinue
          Push-Location $engine
          & ../../nod.exe skills-validation-diagnostic.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged skills validation failed' }
          Pop-Location
